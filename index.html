<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14110f"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>AI Video Studio</title>
<style>
:root{--bg:#14110f;--card:#211d1a;--line:#3a332d;--tx:#f3ece4;--mut:#a89d92;--ac:#3ddc97;--err:#ff7a6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:560px;margin:auto;padding:16px}h1{font-size:1.5rem;margin:8px 0 16px}h2{font-size:1.05rem;margin:24px 0 10px}label{display:block;color:var(--mut);font-size:.85rem;margin:12px 0 4px}textarea,input,select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}textarea{min-height:110px;resize:vertical}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.row{display:flex;gap:8px}.row>*{flex:1}.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{flex:1;background:var(--card);color:var(--mut);border:0;padding:12px;font:inherit}.seg button.on{background:var(--ac);color:#14110f;font-weight:700}.go{width:100%;margin-top:18px;background:var(--ac);color:#14110f;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;font-size:1.05rem}.go:disabled{opacity:.5}.btn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;font-size:.9rem;text-decoration:none;display:inline-block}#st{margin-top:12px;color:var(--mut);min-height:1.5em}#st.err{color:var(--err)}details{margin-top:18px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}summary{cursor:pointer;color:var(--mut)}.v{background:var(--card);border-radius:12px;padding:10px;margin-bottom:14px}.v video{width:100%;border-radius:8px;background:#000}.v p{margin:8px 0;font-size:.9rem;color:var(--mut)}.note{font-size:.82rem;color:var(--mut);margin-top:6px}#inst{display:none;margin-bottom:10px}
</style></head>
<body><main><h1>استوديو الفيديو بالذكاء الاصطناعي</h1><button class="btn" id="inst">ثبّت التطبيق على الهاتف</button>
<label for="pr">وصف الفيديو</label><textarea id="pr" placeholder="مثال: سيارة رياضية حمراء كتسوق فطريق ساحلي عند الغروب"></textarea>
<label>النوع</label><div class="seg" id="style"><button data-s="real" class="on">واقعي</button><button data-s="anim">أنيميشن</button></div>
<div class="row"><div><label for="res">الجودة</label><select id="res"><option>480p</option><option selected>720p</option><option>1080p</option><option>4k</option></select></div><div><label for="dur">المدة</label><select id="dur"><option selected value="5">5 ثواني</option><option value="8">8 ثواني</option><option value="10">10 ثواني</option></select></div></div>
<details id="cfg"><summary>الإعدادات (مفتاح API)</summary><label for="key">مفتاح fal.ai</label><input id="key" type="password" dir="ltr" placeholder="key_id:key_secret" autocomplete="off"><label for="model">موديل fal.ai</label><input id="model" dir="ltr" value="fal-ai/wan/v2.2-a14b/text-to-video"><p class="note">المفتاح كيتخزن غير فهاتفك. لا تشارك مفتاح API مع أي شخص.</p></details>
<button class="go" id="go">أنشئ الفيديو</button><div id="st" role="status"></div><h2>فيديوهاتي</h2><div id="lib"></div></main>
<script>
const $=id=>document.getElementById(id),get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let style='real';$('key').value=get('key','');$('model').value=get('model',$('model').value);if(!$('key').value)$('cfg').open=true;['key','model'].forEach(i=>$(i).onchange=()=>set(i,$(i).value.trim()));$('style').onclick=e=>{let b=e.target.closest('button');if(!b)return;style=b.dataset.s;[...$('style').children].forEach(x=>x.classList.toggle('on',x===b))};const say=(t,e)=>{$('st').textContent=t;$('st').className=e?'err':''},wait=ms=>new Promise(r=>setTimeout(r,ms));
async function generate(){let key=$('key').value.trim(),prompt=$('pr').value.trim(),model=$('model').value.trim();if(!key){$('cfg').open=true;return say('دخّل مفتاح API أولا.',1)}if(!prompt)return say('كتب وصف الفيديو.',1);let full=style==='real'?prompt+', photorealistic, cinematic, natural lighting':prompt+', 3D animated style, vibrant colors',H={'Authorization':'Key '+key,'Content-Type':'application/json'};$('go').disabled=true;say('كنرسل الطلب…');try{let r=await fetch('https://queue.fal.run/'+model,{method:'POST',headers:H,body:JSON.stringify({prompt:full,resolution:$('res').value,duration:+$('dur').value,aspect_ratio:'16:9'})});if(!r.ok)throw Error(r.status===401||r.status===403?'المفتاح غير صحيح أو الكريدي سالا.':'خطأ '+r.status);let j=await r.json(),s;for(let i=0;i<180;i++){await wait(4000);s=await(await fetch(j.status_url,{headers:H})).json();if(s.status==='COMPLETED')break;if(s.status==='FAILED'||s.error)throw Error('فشل التوليد.');say('كنولّد الفيديو… '+(i*4)+'ث')}let out=await(await fetch(j.response_url,{headers:H})).json(),url=out.video?.url;if(!url)throw Error('ما رجع حتى فيديو. تأكد من اسم الموديل.');let l=get('lib',[]);l.unshift({url,prompt,t:Date.now()});set('lib',l.slice(0,30));render();say('واجد! الفيديو فالأسفل.')}catch(e){say(e.message||'خطأ فالاتصال.',1)}$('go').disabled=false}$('go').onclick=generate;
function render(){let l=get('lib',[]),box=$('lib');box.textContent='';if(!l.length)return box.innerHTML='<p class="note">ما كاين حتى فيديو مازال.</p>';l.forEach((v,i)=>{let d=document.createElement('div');d.className='v';d.innerHTML='<video controls playsinline preload="metadata"></video><p></p><button class="btn">تحميل</button> <button class="btn">حذف</button>';d.querySelector('video').src=v.url;d.querySelector('p').textContent=v.prompt;d.querySelectorAll('button')[0].onclick=()=>{let a=document.createElement('a');a.href=v.url;a.download='video-'+v.t+'.mp4';a.click()};d.querySelectorAll('button')[1].onclick=()=>{l.splice(i,1);set('lib',l);render()};box.append(d)})}render();let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('inst').style.display='inline-block'});$('inst').onclick=async()=>{if(dp){await dp.prompt();dp=null;$('inst').style.display='none'}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
