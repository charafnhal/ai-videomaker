<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1020">
  <meta name="description" content="AI Video Studio - مولد فيديوهات احترافي من الوصف النصي">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>AI Video Studio</title>
  <style>
    :root {
      --bg-1: #0d1020;
      --bg-2: #10182d;
      --panel: rgba(17, 25, 42, 0.9);
      --panel-2: rgba(14, 21, 36, 0.9);
      --card: rgba(19, 31, 50, 0.95);
      --line: rgba(142, 164, 192, 0.18);
      --text: #eef6ff;
      --muted: #9fb2cc;
      --accent: #4cc9f0;
      --accent-2: #7ef0b2;
      --accent-3: #9b5de5;
      --danger: #ff6b6b;
      --warning: #f9c74f;
      --success: #66e09a;
      --shadow: rgba(3, 6, 12, 0.45);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(76, 201, 240, 0.18), transparent 25%),
        radial-gradient(circle at bottom right, rgba(155, 93, 229, 0.18), transparent 25%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      min-height: 100vh;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 16px 40px;
    }

    .shell {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0 22px 60px var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(9, 15, 25, 0.7);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-3));
      box-shadow: 0 10px 25px rgba(76, 201, 240, 0.45);
    }

    .brand-mark svg { width: 22px; height: 22px; }

    .install-btn {
      display: none;
      border: 1px solid rgba(76, 201, 240, 0.45);
      background: rgba(76, 201, 240, 0.08);
      color: var(--accent);
      border-radius: 999px;
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
      transition: all .25s ease;
    }

    .install-btn:hover {
      background: rgba(76, 201, 240, 0.12);
      transform: translateY(-1px);
    }

    .content {
      padding: 18px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(18,29,47,0.9), rgba(12,18,30,0.88));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .panel-title {
      font-size: 0.83rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
      font-size: 0.84rem;
    }

    label {
      display: block;
      margin: 12px 0 7px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 600;
    }

    textarea, input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(8, 12, 21, 0.8);
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    textarea {
      min-height: 118px;
      resize: vertical;
    }

    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: rgba(76, 201, 240, 0.8);
      box-shadow: 0 0 0 4px rgba(76, 201, 240, 0.12);
    }

    input::placeholder { color: rgba(159,178,204,0.8); }

    .seg {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .seg button {
      border: 1px solid var(--line);
      background: rgba(8, 12, 21, 0.8);
      color: var(--muted);
      border-radius: 12px;
      padding: 11px 10px;
      font: inherit;
      cursor: pointer;
      transition: all .2s ease;
      font-weight: 700;
    }

    .seg button.on {
      background: linear-gradient(135deg, rgba(76, 201, 240, 0.9), rgba(126, 240, 178, 0.88));
      color: #09131f;
      border-color: transparent;
      box-shadow: 0 12px 20px rgba(76, 201, 240, 0.2);
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .details-wrap {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(11, 17, 28, 0.8);
    }

    details summary {
      cursor: pointer;
      list-style: none;
      padding: 14px 16px;
      user-select: none;
      color: var(--muted);
      font-weight: 700;
    }

    details summary::-webkit-details-marker { display: none; }
    details[open] summary { border-bottom: 1px solid var(--line); }
    details .inner { padding: 14px 16px 18px; }

    .info-box {
      background: rgba(76, 201, 240, 0.06);
      border: 1px solid rgba(76, 201, 240, 0.2);
      border-radius: 12px;
      padding: 12px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.7;
    }

    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #061320;
      padding: 15px 20px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      box-shadow: 0 10px 30px rgba(76, 201, 240, 0.25);
    }

    .primary-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(76, 201, 240, 0.32);
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: progress;
    }

    .status {
      min-height: 20px;
      margin-top: 14px;
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
    }

    .status.success { background: rgba(102, 224, 154, 0.08); border-color: rgba(102, 224, 154, 0.24); color: var(--success); }
    .status.error { background: rgba(255, 107, 107, 0.07); border-color: rgba(255, 107, 107, 0.2); color: var(--danger); }
    .status.info { background: rgba(76, 201, 240, 0.06); border-color: rgba(76, 201, 240, 0.2); color: var(--accent); }

    .progress {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--line);
      margin-top: 10px;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: inherit;
      transition: width .35s ease;
    }

    .library {
      display: grid;
      gap: 14px;
      margin-top: 14px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 26px 18px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
    }

    .video-card {
      background: rgba(10, 15, 23, 0.8);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }

    .video-thumb {
      position: relative;
      background: #000;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    .video-thumb video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .video-body {
      padding: 12px;
    }

    .video-title {
      margin: 0 0 8px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-meta {
      font-size: 0.76rem;
      color: var(--muted);
      margin: 0;
    }

    .video-actions {
      display: flex;
      gap: 8px;
      padding: 0 12px 12px;
    }

    .video-actions button {
      flex: 1;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 10px;
      cursor: pointer;
      font: inherit;
      transition: border-color .2s ease, transform .2s ease;
    }

    .video-actions button:hover {
      border-color: rgba(76, 201, 240, 0.55);
      transform: translateY(-1px);
    }

    @media (max-width: 560px) {
      .two-col, .seg { grid-template-columns: 1fr; }
      .topbar { padding: 16px 14px; }
      .content { padding: 14px; }
      .panel { padding: 14px; }
      .brand { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <main>
    <div class="shell">
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
              <rect x="8" y="16" width="40" height="28" rx="8" fill="#071827"/>
              <path d="M28 27.5V36.5L38 32L28 27.5Z" fill="#ffffff"/>
            </svg>
          </div>
          <span>AI Video Studio</span>
        </div>
        <button class="install-btn" id="installBtn">تثبيت التطبيق</button>
      </div>

      <div class="content">
        <section class="panel">
          <div class="panel-head">
            <div class="panel-title">وصف الفيديو</div>
          </div>
          <label for="prompt">اكتب وصفًا واضحًا ومتسلسلًا</label>
          <textarea id="prompt" placeholder="مثال: شاطئ هادئ في الصباح الباكر، أشعة الشمس الذهبية تعكس على سطح البحر، طائرة صغيرة فوق الأفق، مشهد سينمائي واقعي ومهيب..."></textarea>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div class="panel-title">إعدادات الفيديو</div>
          </div>

          <label>أسلوب الفيديو</label>
          <div class="seg" id="styleSegment">
            <button type="button" class="on" data-style="realistic">واقعي</button>
            <button type="button" data-style="animated">أنيميشن</button>
            <button type="button" data-style="abstract">تجريدي</button>
          </div>

          <div class="two-col" style="margin-top: 14px;">
            <div>
              <label for="resolution">الجودة</label>
              <select id="resolution">
                <option value="480p">480p</option>
                <option value="720p" selected>720p</option>
                <option value="1080p">1080p</option>
                <option value="4k">4K</option>
              </select>
            </div>
            <div>
              <label for="duration">المدة</label>
              <select id="duration">
                <option value="5" selected>5 ثواني</option>
                <option value="8">8 ثواني</option>
                <option value="10">10 ثواني</option>
                <option value="15">15 ثانية</option>
              </select>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="details-wrap">
            <details id="settingsDetails">
              <summary>إعدادات API</summary>
              <div class="inner">
                <label for="apiKey">مفتاح fal.ai</label>
                <input id="apiKey" type="password" dir="ltr" placeholder="key_id:key_secret" autocomplete="off">

                <label for="model">اسم النموذج</label>
                <input id="model" dir="ltr" value="fal-ai/wan/v2.2-a14b/text-to-video">

                <div class="info-box">
                  قم بالتسجيل في <a href="https://www.fal.ai" target="_blank" rel="noreferrer" style="color:var(--accent); text-decoration:none;">fal.ai</a> للحصول على مفتاح مجاني. يتم حفظ المفتاح محليًا فقط على هذا الجهاز.
                </div>
              </div>
            </details>
          </div>
        </section>

        <button class="primary-btn" id="generateBtn" type="button">إنشاء الفيديو</button>
        <div id="status" class="status info">جاهز للإنشاء</div>
        <div class="progress"><span id="progressFill"></span></div>

        <section class="panel" style="margin-top: 20px;">
          <div class="panel-head">
            <div class="panel-title">مكتبة الفيديوهات</div>
          </div>
          <div id="library" class="library"></div>
        </section>
      </div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const Storage = {
      get(key, fallback) {
        try {
          const v = localStorage.getItem(key);
          return v === null ? fallback : JSON.parse(v);
        } catch (e) {
          return fallback;
        }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
      }
    };

    let selectedStyle = 'realistic';

    function setStatus(msg, type = 'info') {
      const el = $('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    function setProgress(percent) {
      $('progressFill').style.width = percent + '%';
    }

    $('apiKey').value = Storage.get('apiKey', '');
    $('model').value = Storage.get('model', $('model').value);
    if (!$('apiKey').value) {
      $('settingsDetails').open = true;
    }

    ['apiKey', 'model'].forEach((id) => {
      $(id).addEventListener('change', () => {
        Storage.set(id, $(id).value.trim());
      });
    });

    $('styleSegment').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      selectedStyle = btn.dataset.style;
      [...$('styleSegment').querySelectorAll('button')].forEach((b) => {
        b.classList.toggle('on', b === btn);
      });
    });

    function renderLibrary() {
      const items = Storage.get('library', []);
      const lib = $('library');
      lib.innerHTML = '';

      if (!items.length) {
        lib.innerHTML = '<div class="empty">لم يتم إنشاء أي فيديو حتى الآن. ابدأ بكتابة وصف للفيديو.</div>';
        return;
      }

      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'video-card';

        const created = new Date(item.created).toLocaleDateString('ar-SA', {
          year: 'numeric', month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });

        card.innerHTML = `
          <div class="video-thumb">
            <video src="${item.url}" controls playsinline preload="metadata"></video>
          </div>
          <div class="video-body">
            <p class="video-title">${item.prompt}</p>
            <p class="video-meta">${created} · ${item.resolution}</p>
          </div>
          <div class="video-actions">
            <button type="button" data-action="download">تحميل</button>
            <button type="button" data-action="delete">حذف</button>
          </div>
        `;

        card.querySelector('[data-action="download"]').addEventListener('click', () => downloadVideo(item.url, 'video-' + Date.now() + '.mp4'));
        card.querySelector('[data-action="delete"]').addEventListener('click', () => {
          const arr = Storage.get('library', []);
          arr.splice(index, 1);
          Storage.set('library', arr);
          renderLibrary();
        });

        lib.appendChild(card);
      });
    }

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function downloadVideo(url, filename) {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
      } catch (e) {
        window.open(url, '_blank');
      }
    }

    async function generateVideo() {
      const apiKey = $('apiKey').value.trim();
      const prompt = $('prompt').value.trim();
      const model = $('model').value.trim();

      if (!apiKey) {
        $('settingsDetails').open = true;
        setStatus('أدخل مفتاح fal.ai أولاً', 'error');
        return;
      }

      if (!prompt) {
        setStatus('اكتب وصف الفيديو أولاً', 'error');
        return;
      }

      const stylePrompt = selectedStyle === 'realistic'
        ? 'cinematic photorealistic, highly detailed, realistic lighting, ultra sharp'
        : selectedStyle === 'animated'
        ? 'stylized 3D animation, vibrant colors, smooth motion, polished animation'
        : 'abstract art, surreal, artistic, dreamlike composition';

      const fullPrompt = `${prompt}, ${stylePrompt}`;
      const headers = {
        'Authorization': 'Key ' + apiKey,
        'Content-Type': 'application/json'
      };

      $('generateBtn').disabled = true;
      setStatus('جاري إرسال الطلب...', 'info');
      setProgress(8);

      try {
        const response = await fetch('https://queue.fal.run/' + model, {
          method: 'POST',
          headers,
          body: JSON.stringify({
            prompt: fullPrompt,
            resolution: $('resolution').value,
            duration: Number($('duration').value),
            aspect_ratio: '16:9'
          })
        });

        if (!response.ok) {
          const text = await response.text();
          const msg = response.status === 401 || response.status === 403 ? 'المفتاح غير صحيح أو الرصيد غير متوفر' : 'فشل الطلب: ' + response.status;
          throw new Error(msg + (text ? ' - ' + text.slice(0, 120) : ''));
        }

        const job = await response.json();
        setStatus('جاري معالجة الفيديو...', 'info');
        setProgress(18);

        for (let i = 0; i < 180; i++) {
          await sleep(4000);
          const poll = await fetch(job.status_url, { headers });
          const statusResult = await poll.json();

          if (statusResult.status === 'COMPLETED') {
            setProgress(55);
            break;
          }

          if (statusResult.status === 'FAILED' || statusResult.error) {
            throw new Error('فشل إنشاء الفيديو. تحقق من الوصف أو نموذج fal.ai.');
          }

          const pos = statusResult.queue_position ?? '...';
          setStatus(`جاري التصنيع... (${i * 4} ث) · موقع الطابور: ${pos}`, 'info');
          setProgress(18 + ((i + 1) / 180) * 30);
        }

        setStatus('جاري تحميل النتيجة...', 'info');
        setProgress(75);

        const outputResp = await fetch(job.response_url, { headers });
        const output = await outputResp.json();
        const videoUrl = output.video && output.video.url;

        if (!videoUrl) {
          throw new Error('لم يتم إرجاع رابط فيديو. تأكد من اسم النموذج.');
        }

        const items = Storage.get('library', []);
        items.unshift({
          url: videoUrl,
          prompt: prompt,
          resolution: $('resolution').value,
          created: new Date().toISOString()
        });
        Storage.set('library', items.slice(0, 25));

        setStatus('تم إنشاء الفيديو بنجاح!', 'success');
        setProgress(100);
        renderLibrary();
        $('prompt').value = '';
      } catch (err) {
        setStatus(err.message || 'حدث خطأ غير متوقع', 'error');
        setProgress(0);
      } finally {
        $('generateBtn').disabled = false;
        setTimeout(() => setProgress(0), 1200);
      }
    }

    $('generateBtn').addEventListener('click', generateVideo);
    renderLibrary();

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredPrompt = event;
      $('installBtn').style.display = 'inline-block';
    });

    $('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      $('installBtn').style.display = 'none';
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
